name: Generate snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#d6336c&color_dots=#ebedf0,#f9c6d6,#f28bb0,#e5568a,#d6336c
            dist/snake-dark.svg?palette=github-dark&color_snake=#ff5c8f&color_dots=#161e26,#3a1f2b,#7a2c4b,#c23b6d,#ff5c8f

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
