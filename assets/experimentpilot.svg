<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="ExperimentPilot AI: Active diagnosis of ML model failures">
<style>
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.bel{transform-box:fill-box;transform-origin:bottom;animation:6s ease-in-out infinite}
.win{animation-name:win}.lose{animation-name:lose}
@keyframes win{0%,10%{transform:scaleY(.35)}55%,85%{transform:scaleY(1)}100%{transform:scaleY(.35)}}
@keyframes lose{0%,10%{transform:scaleY(.9)}55%,85%{transform:scaleY(.12)}100%{transform:scaleY(.9)}}
.step{opacity:0;animation:6s linear infinite}
.t1{animation-name:t1}.t2{animation-name:t2}.t3{animation-name:t3}
@keyframes t1{0%,30%{opacity:1}31%,100%{opacity:0}}
@keyframes t2{0%,30%{opacity:0}31%,55%{opacity:1}56%,100%{opacity:0}}
@keyframes t3{0%,55%{opacity:0}56%,92%{opacity:1}93%,100%{opacity:0}}
</style>
