<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="AlumniConnect: Full-stack alumni mentorship portal">
<style>
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.edge{stroke:#ff5c8f;stroke-width:1.5;fill:none;stroke-dasharray:240;stroke-dashoffset:240;animation:link 6s ease infinite}
@keyframes link{0%,10%{stroke-dashoffset:240;opacity:1}40%,80%{stroke-dashoffset:0;opacity:1}95%,100%{stroke-dashoffset:0;opacity:0}}
.mail{animation:mail 6s ease infinite;opacity:0}
@keyframes mail{0%,40%{opacity:0;transform:translateY(6px)}50%,85%{opacity:1;transform:none}100%{opacity:0}}
</style>
<rect width="1200" height="300" rx="14" fill="#161e26" stroke="#26323c"/>
