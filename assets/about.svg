ass="ln" style="animation-delay:3.50s"><text x="40" y="316" fill="#3cc6c4">✓</text><text x="70" y="316" xml:space="preserve"><tspan fill="#3cc6c4">profile loaded in 1.2 s (it used to take 3 s)</tspan></text></g></g>
